  <header class="top">
    <div class="brand">
      <h1>Diário de <em>leituras</em></h1>
      <p id="subtitle">Carregando sua estante…</p>
    </div>
    <div class="top-actions">
      <label class="sr" for="year">Ano</label>
      <select id="year" class="year"></select>
      <button id="addBtn" class="btn" type="button">+ Livro</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-shelf" aria-selected="true" type="button">Estante</button>
    <button class="tab" role="tab" id="tab-year" aria-selected="false" type="button">O ano em números</button>
  </nav>

  <div id="notice" class="notice" hidden></div>

  <section id="view-shelf">
    <div class="bar">
      <div class="chips" id="chips"></div>
      <div class="sort">
        <label for="sort">Ordenar por</label>
        <select id="sort">
          <option value="order">ordem de leitura</option>
          <option value="rating">nota</option>
          <option value="title">título</option>
          <option value="author">autor</option>
        </select>
      </div>
    </div>
    <div id="shelf" class="shelf"></div>
    <div id="shelfEmpty" class="empty" hidden></div>
  </section>

  <section id="view-year" hidden></section>

  <footer class="foot">
    <span id="whoami"></span>
    <button id="logout" class="linkish" type="button">Sair</button>
  </footer>
</div>

<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
