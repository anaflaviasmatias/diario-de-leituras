<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Leituras</title>
<meta name="theme-color" content="#5B2F1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leituras">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- entrada -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" novalidate>
    <h1>Diário de <em>leituras</em></h1>
    <p id="loginIntro">Entre para ver sua estante.</p>
    <div id="loginMsg" class="login-msg" role="status" hidden></div>
    <div>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    </div>
    <button id="loginBtn" class="btn" type="submit">Entrar</button>
    <p><span id="switchText">Primeira vez aqui?</span> <button id="switchMode" class="linkish" type="button">Criar conta</button></p>
  </form>
</main>

<!-- app -->
<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="brand">
      <h1>Diário de <em>leituras</em></h1>
      <p id="subtitle">Carregando sua estante…</p>
    </div>
    <div class="top-actions">
      <label class="sr" for="year">Ano</label>
      <select id="year" class="year"></select>
      <button id="addBtn" class="btn" type="button">+ Livro</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-shelf" aria-selected="true" type="button">Estante</button>
    <button class="tab" role="tab" id="tab-year" aria-selected="false" type="button">O ano em números</button>
  </nav>

  <div id="notice" class="notice" hidden></div>

  <section id="view-shelf">
    <div class="bar">
      <div class="chips" id="chips"></div>
      <div class="sort">
        <label for="sort">Ordenar por</label>
        <select id="sort">
          <option value="order">ordem de leitura</option>
          <option value="rating">nota</option>
          <option value="title">título</option>
          <option value="author">autor</option>
        </select>
      </div>
    </div>
    <div id="shelf" class="shelf"></div>
    <div id="shelfEmpty" class="empty" hidden></div>
  </section>

  <section id="view-year" hidden></section>

  <footer class="foot">
    <span id="whoami"></span>
    <button id="logout" class="linkish" type="button">Sair</button>
  </footer>
</div>

<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
